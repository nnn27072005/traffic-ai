version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: traffic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic_password
      POSTGRES_DB: traffic_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
